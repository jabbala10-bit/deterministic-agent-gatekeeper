[project]
name = "deterministic-agent-gatekeeper"
version = "0.4.0"
description = "A pure, replayable decision core for AI agent tool calls: the model proposes, a pure function disposes."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["ai-agents", "authorization", "cedar", "determinism", "policy-as-code", "audit", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
# The engine version is part of every decision's gate identity, so it is pinned exactly.
dependencies = [
    "cedarpy==4.12.0",
    "cryptography==46.0.4",
    "idna==3.20",
]

[project.urls]
Repository = "https://github.com/jabbala10-bit/deterministic-agent-gatekeeper"
Issues = "https://github.com/jabbala10-bit/deterministic-agent-gatekeeper/issues"

[project.scripts]
gatekeeper = "gatekeeper.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gatekeeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
